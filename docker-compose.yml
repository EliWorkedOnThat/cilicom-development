services:
  db:
    image: postgres:17
    container_name: cilicom-valley-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cilicom_valley
    ports:
      - "127.0.0.1:5422:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cilicom_valley"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: